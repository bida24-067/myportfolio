name = "loagomov-portfolio"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

routes = [
  { pattern = "loagomov.blancsociety.co.uk", custom_domain = true }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
CONTACT_EMAIL = "hello@blancsociety.co.uk"
RESEND_FROM_EMAIL = "Blanc Society <confirmations@mail.blancsociety.co.uk>"
PORTFOLIO_CONTACT_EMAIL = "hello@blancsociety.co.uk"
